publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  musicare_dart_host_sdk:
    path: ../host_sdk
  path_provider: ^2.1.6
  archive: ^4.2.0
  http: ^1.6.0
  pub_semver: ^2.2.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
