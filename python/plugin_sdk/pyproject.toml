[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "musicare-plugin-sdk"
version = "1.0.0"
description = "Pure Python SDK and contracts for MusicAre Audio Source Plugins."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "MusicAre Team" }
]
dependencies = []

[project.scripts]
musicare-build = "musicare_plugin_sdk.builder:build_plugin"
musicare-play = "musicare_plugin_sdk.player:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["musicare_plugin_sdk*"]