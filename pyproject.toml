[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "musicare-audiosource-sdk"
version = "1.0.0"
description = "Pure Python SDK and contracts for MusicAre Audio Source Plugins."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "MusicAre Team" }
]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["musicare_sdk*"]